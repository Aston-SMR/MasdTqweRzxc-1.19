<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MTR 黑金終極版 + 資金控倉版</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTR Black Gold Bankroll">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#050505;
  --gold:#f5d06f;
  --gold-2:#c89b3c;
  --gold-3:#8a6a21;
  --panel:#111111;
  --panel-2:#171717;
  --line:#2d2412;
  --soft:#1a1a1a;
  --text:#f7e7b3;
  --muted:#b7a47a;
  --blue:#60a5fa;
  --red:#f87171;
  --green:#34d399;
  --orange:#fb923c;
  --gray:#9ca3af;
  --hit:#14532d;
  --miss:#7f1d1d;
  --draw:#374151;
  --shadow:0 0 0 1px rgba(245,208,111,.12),0 8px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle at top,#15110a 0%,#080808 35%,#000 100%);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
body{
  overflow:hidden;
  color:var(--text);
}
.app{
  height:100dvh;
  max-width:920px;
  margin:0 auto;
  display:grid;
  grid-template-rows:auto auto auto auto auto 1fr;
  gap:6px;
  padding:6px;
}
.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:8px 10px;
  background:linear-gradient(180deg,#1a1408 0%, #0d0d0d 100%);
  box-shadow:var(--shadow);
}
.logo-mark{
  width:34px;height:34px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;
  color:#111;
  background:linear-gradient(135deg,#fff2c2 0%,#f5d06f 45%,#b8872e 100%);
  box-shadow:0 0 12px rgba(245,208,111,.35);
}
.logo-title{
  color:#fff4cf;
  font-size:16px;
  font-weight:900;
  line-height:1;
  letter-spacing:.5px;
}
.logo-sub{
  color:#bfa56b;
  font-size:9px;
  letter-spacing:1.8px;
  margin-top:2px;
}

.top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.side{
  background:linear-gradient(180deg,#181818 0%, #101010 100%);
  border:1px solid var(--line);
  border-radius:15px;
  padding:8px 7px;
  box-shadow:var(--shadow);
}
.side.player{box-shadow:0 0 0 1px rgba(96,165,250,.16),0 8px 18px rgba(0,0,0,.35)}
.side.banker{box-shadow:0 0 0 1px rgba(248,113,113,.16),0 8px 18px rgba(0,0,0,.35)}
.side-title{
  text-align:center;
  font-size:13px;
  font-weight:900;
  color:#fff2c7;
  margin-bottom:6px;
}
.side-sub{
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}
.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}
.card-cell{
  height:38px;
  border-radius:10px;
  border:1px solid #3a2e15;
  background:linear-gradient(180deg,#232323 0%,#141414 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
  color:#fff7dd;
  user-select:none;
  cursor:pointer;
}
.card-cell.span2{grid-column:1 / span 2}
.card-cell.active{
  border-color:#f5d06f;
  box-shadow:0 0 0 2px rgba(245,208,111,.15),0 0 12px rgba(245,208,111,.18) inset;
  background:linear-gradient(180deg,#32270f 0%,#19150d 100%);
}
.card-cell.empty::after{
  font-size:10px;
  font-weight:800;
  color:#8a7b57;
}
.p1.empty::after{content:"P1"}
.p2.empty::after{content:"P2"}
.p3.empty::after{content:"P3"}
.b1.empty::after{content:"B1"}
.b2.empty::after{content:"B2"}
.b3.empty::after{content:"B3"}

.main-panel,
.predict,
.bankroll-panel,
.keys,
.history-panel{
  background:linear-gradient(180deg,#171717 0%, #101010 100%);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
}

.main-panel{padding:8px}
.info-row{
  display:grid;
  grid-template-columns:auto auto 1fr auto auto auto;
  gap:5px;
  align-items:center;
}
.badge{
  min-width:54px;
  padding:5px 7px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  text-align:center;
  border:1px solid #3b2f17;
  background:#151515;
}
.badge.player{color:var(--blue)}
.badge.banker{color:var(--red)}
.winner{
  font-size:14px;
  font-weight:900;
  text-align:center;
}
.winner.player{color:var(--blue)}
.winner.banker{color:var(--red)}
.winner.tie{color:var(--green)}
.round-box{
  display:flex;
  align-items:center;
  gap:4px;
  border:1px solid #3b2f17;
  background:#111;
  border-radius:9px;
  padding:4px 6px;
}
.round-box span{
  font-size:10px;
  color:var(--muted);
  font-weight:900;
}
.round-input, .money-input{
  width:58px;
  border:1px solid #53401d;
  border-radius:7px;
  padding:3px 4px;
  font-size:11px;
  background:#1a1a1a;
  color:#fff1c5;
}
.money-input.wide{width:78px}
.btn{
  border:none;
  border-radius:9px;
  padding:6px 7px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  color:#111;
  background:linear-gradient(180deg,#f5d06f 0%, #c89b3c 100%);
}
.btn:active{transform:scale(.98)}
.btn-clear{
  background:linear-gradient(180deg,#d6d3d1 0%, #78716c 100%);
  color:#111;
}
.btn-history{
  background:linear-gradient(180deg,#fda4af 0%, #dc2626 100%);
  color:#fff;
}
.btn-win{
  background:linear-gradient(180deg,#86efac 0%, #16a34a 100%);
  color:#062a12;
}
.btn-lose{
  background:linear-gradient(180deg,#fca5a5 0%, #dc2626 100%);
  color:#fff;
}
.btn-tie{
  background:linear-gradient(180deg,#d1d5db 0%, #6b7280 100%);
  color:#111;
}
.detail{
  margin-top:6px;
  min-height:14px;
  font-size:11px;
  color:#d8c28a;
}

.predict{
  padding:8px;
  display:grid;
  grid-template-rows:auto auto auto;
  gap:6px;
}
.predict-line{
  font-size:16px;
  font-weight:900;
  line-height:1.2;
  word-break:break-word;
  color:#fff5d8;
}
.predict-meta{
  font-size:10px;
  line-height:1.25;
  color:#d8c28a;
}
.m-label{color:var(--red)}
.t-label{color:var(--green)}
.r-label{color:var(--orange)}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}
.stat{
  background:linear-gradient(180deg,#191919 0%, #121212 100%);
  border:1px solid #3b2f17;
  border-radius:11px;
  padding:6px 3px;
  text-align:center;
}
.stat.best{
  border-color:#f5d06f;
  box-shadow:0 0 0 1px rgba(245,208,111,.25),0 0 12px rgba(245,208,111,.18);
}
.stat-name{
  font-size:9px;
  font-weight:900;
  color:var(--muted);
}
.stat-rate{
  margin-top:2px;
  font-size:13px;
  font-weight:900;
}
.stat.m .stat-rate{color:var(--red)}
.stat.t .stat-rate{color:var(--green)}
.stat.r .stat-rate{color:var(--orange)}

.heat{
  display:grid;
  grid-template-columns:1fr auto;
  gap:5px;
}
.heat-box,.power-box{
  background:linear-gradient(180deg,#1a1a1a 0%,#111 100%);
  border:1px solid #3b2f17;
  border-radius:10px;
  padding:7px 8px;
  font-size:10px;
  font-weight:900;
  color:#e8d2a1;
}
.power-strong{color:#fecaca}
.power-mid{color:#fdba74}
.power-low{color:#93c5fd}
.power-wait{color:#d1d5db}

.bankroll-panel{
  padding:8px;
  display:grid;
  grid-template-rows:auto auto;
  gap:6px;
}
.bankroll-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}
.bk-box{
  background:#151515;
  border:1px solid #3b2f17;
  border-radius:10px;
  padding:6px 5px;
}
.bk-label{
  font-size:9px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:4px;
}
.bk-value{
  font-size:12px;
  font-weight:900;
  color:#fff1c8;
}
.bk-profit.pos{color:#86efac}
.bk-profit.neg{color:#fca5a5}
.bankroll-actions{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  align-items:center;
}
.money-box{
  display:flex;
  align-items:center;
  gap:4px;
  border:1px solid #3b2f17;
  background:#111;
  border-radius:9px;
  padding:4px 6px;
  min-width:0;
}
.money-box span{
  font-size:9px;
  color:var(--muted);
  font-weight:900;
  white-space:nowrap;
}

.keys{
  padding:7px;
}
.key-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
}
.key{
  border:1px solid #45351a;
  background:linear-gradient(180deg,#1f1f1f 0%, #121212 100%);
  border-radius:9px;
  min-height:28px;
  font-size:10px;
  font-weight:900;
  color:#f9e3a4;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.key:active{
  transform:scale(.97);
  box-shadow:0 0 10px rgba(245,208,111,.15);
}
.key.skip{color:#d1d5db}

.history-panel{
  padding:8px;
  min-height:0;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:6px;
}
.history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.history-title{
  font-size:11px;
  font-weight:900;
  color:#fff1c8;
}
.history-sub{
  font-size:9px;
  color:var(--muted);
}
.history-list{
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.history-empty{
  font-size:11px;
  color:var(--muted);
  padding-top:4px;
}
.h-item{
  border:1px solid #3b2f17;
  border-radius:10px;
  background:linear-gradient(180deg,#1b1b1b 0%, #121212 100%);
  padding:6px;
}
.h-top{
  font-size:9px;
  color:var(--muted);
  margin-bottom:4px;
}
.h-grid{
  display:grid;
  grid-template-columns:74px 1fr 52px;
  gap:4px;
  align-items:start;
}
.h-cards{
  font-size:9px;
  line-height:1.2;
  color:#f2dfaf;
}
.h-mtr{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}
.h-mtr > div{
  font-size:8px;
  line-height:1.1;
  text-align:center;
  border:1px solid #3b2f17;
  background:#151515;
  border-radius:7px;
  padding:4px 2px;
  white-space:nowrap;
  overflow:hidden;
  color:#f2dfaf;
}
.h-result{
  font-size:9px;
  font-weight:900;
  text-align:center;
  border-radius:999px;
  padding:5px 4px;
  background:#151515;
}
.hit{color:#bbf7d0;background:#052e16}
.miss{color:#fecaca;background:#450a0a}
.draw{color:#d1d5db;background:#1f2937}
.status-hit{color:#86efac;font-weight:900}
.status-miss{color:#fca5a5;font-weight:900}
.status-draw{color:#d1d5db;font-weight:900}

@media (min-width:700px){
  .app{gap:8px;padding:8px}
  .card-cell{height:44px;font-size:17px}
  .predict-line{font-size:22px}
  .predict-meta{font-size:12px}
  .stat-name{font-size:11px}
  .stat-rate{font-size:16px}
  .heat-box,.power-box{font-size:12px}
  .bk-label{font-size:11px}
  .bk-value{font-size:15px}
  .money-box span{font-size:11px}
  .key{min-height:34px;font-size:12px}
  .history-title{font-size:13px}
  .history-sub{font-size:11px}
  .h-top{font-size:11px}
  .h-grid{grid-template-columns:130px 1fr 78px}
  .h-cards{font-size:11px}
  .h-mtr > div{font-size:10px}
  .h-result{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <div class="logo">
    <div class="logo-mark">B</div>
    <div>
      <div class="logo-title">Baccarat MTR</div>
      <div class="logo-sub">BLACK GOLD + BANKROLL CONTROL</div>
    </div>
  </div>

  <div class="top">
    <div class="side player">
      <div class="side-title">PLAYER<span class="side-sub">閒家</span></div>
      <div class="card-grid">
        <div class="card-cell empty p1" data-index="0"></div>
        <div class="card-cell empty p2" data-index="1"></div>
        <div class="card-cell empty p3 span2" data-index="4"></div>
      </div>
    </div>
    <div class="side banker">
      <div class="side-title">BANKER<span class="side-sub">莊家</span></div>
      <div class="card-grid">
        <div class="card-cell empty b1" data-index="2"></div>
        <div class="card-cell empty b2" data-index="3"></div>
        <div class="card-cell empty b3 span2" data-index="5"></div>
      </div>
    </div>
  </div>

  <div class="main-panel">
    <div class="info-row">
      <div class="badge player" id="playerScore">閒 0</div>
      <div class="badge banker" id="bankerScore">莊 0</div>
      <div class="winner tie" id="winnerText">和局</div>
      <div class="round-box">
        <span>局數</span>
        <input id="roundInput" class="round-input" type="number" min="1" step="1">
      </div>
      <button id="nextBtn" class="btn" type="button">下一局</button>
      <button id="clearBoardBtn" class="btn btn-clear" type="button">清除本局</button>
    </div>
    <div class="detail" id="detailText">請先輸入局數，再依序輸入牌面</div>
  </div>

  <div class="predict">
    <div class="predict-line" id="linePredict">M:-　T:-　R:-</div>
    <div class="predict-meta" id="linePredictMeta">M點差:-/公牌:-｜T真數:-/建議:-｜R尾數:-/翻邊:-</div>

    <div class="stats" id="lineStats">
      <div class="stat m"><div class="stat-name">M勝率</div><div class="stat-rate">0%</div></div>
      <div class="stat t"><div class="stat-name">T勝率</div><div class="stat-rate">0%</div></div>
      <div class="stat r"><div class="stat-name">R勝率</div><div class="stat-rate">0%</div></div>
    </div>

    <div class="heat">
      <div class="heat-box" id="heatBox">熱區判斷：目前尚無資料</div>
      <div class="power-box power-wait" id="powerBox">下注：觀望</div>
    </div>
  </div>

  <div class="bankroll-panel">
    <div class="bankroll-grid">
      <div class="bk-box">
        <div class="bk-label">本金</div>
        <div class="bk-value" id="bankrollBaseText">0</div>
      </div>
      <div class="bk-box">
        <div class="bk-label">目前資金</div>
        <div class="bk-value" id="bankrollNowText">0</div>
      </div>
      <div class="bk-box">
        <div class="bk-label">損益</div>
        <div class="bk-value bk-profit" id="profitText">0</div>
      </div>
      <div class="bk-box">
        <div class="bk-label">建議下注</div>
        <div class="bk-value" id="betSuggestText">0</div>
      </div>
    </div>

    <div class="bankroll-actions">
      <div class="money-box">
        <span>本金</span>
        <input id="bankrollInput" class="money-input wide" type="number" min="0" step="1">
      </div>
      <div class="money-box">
        <span>小%</span>
        <input id="smallPctInput" class="money-input" type="number" min="0" step="0.1" value="1">
      </div>
      <div class="money-box">
        <span>中%</span>
        <input id="midPctInput" class="money-input" type="number" min="0" step="0.1" value="2">
      </div>
      <div class="money-box">
        <span>大%</span>
        <input id="bigPctInput" class="money-input" type="number" min="0" step="0.1" value="3">
      </div>
      <button id="winBtn" class="btn btn-win" type="button">本局贏</button>
      <button id="loseBtn" class="btn btn-lose" type="button">本局輸</button>
    </div>
  </div>

  <div class="keys">
    <div class="key-grid" id="cardButtons">
      <button class="key" type="button" data-card="A">A</button>
      <button class="key" type="button" data-card="2">2</button>
      <button class="key" type="button" data-card="3">3</button>
      <button class="key" type="button" data-card="4">4</button>
      <button class="key" type="button" data-card="5">5</button>
      <button class="key" type="button" data-card="6">6</button>
      <button class="key" type="button" data-card="7">7</button>
      <button class="key" type="button" data-card="8">8</button>
      <button class="key" type="button" data-card="9">9</button>
      <button class="key" type="button" data-card="10">10</button>
      <button class="key" type="button" data-card="J">J</button>
      <button class="key" type="button" data-card="Q">Q</button>
      <button class="key" type="button" data-card="K">K</button>
      <button class="key skip" type="button" id="skipBtn">不補</button>
    </div>
  </div>

  <div class="history-panel">
    <div class="history-head">
      <div>
        <div class="history-title">歷史紀錄</div>
        <div class="history-sub">最近 10 筆｜黑金終極 + 資金控倉</div>
      </div>
      <div style="display:flex;gap:5px;">
        <button id="tieBtn" class="btn btn-tie" type="button">和局</button>
        <button id="clearHistoryBtn" class="btn btn-history" type="button">清除歷史</button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'mtr_black_gold_bankroll_v1';
  const MAX_HISTORY = 10;

  let values = ['', '', '', '', '', ''];
  const order = [0, 1, 2, 3, 4, 5];
  let currentStep = 0;
  let selectedIndex = null;
  let historyData = [];
  let pendingPrediction = null;
  let saveTimer = null;

  let bankrollBase = 0;
  let bankrollNow = 0;
  let recommendedBet = 0;
  let lastBetAmount = 0;
  let lastPowerLabel = '觀望';

  const cells = Array.from(document.querySelectorAll('.card-cell'));
  const roundInputEl = document.getElementById('roundInput');
  const cardButtonsEl = document.getElementById('cardButtons');
  const nextBtn = document.getElementById('nextBtn');
  const clearBoardBtn = document.getElementById('clearBoardBtn');
  const skipBtn = document.getElementById('skipBtn');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const winBtn = document.getElementById('winBtn');
  const loseBtn = document.getElementById('loseBtn');
  const tieBtn = document.getElementById('tieBtn');

  const bankrollInputEl = document.getElementById('bankrollInput');
  const smallPctInputEl = document.getElementById('smallPctInput');
  const midPctInputEl = document.getElementById('midPctInput');
  const bigPctInputEl = document.getElementById('bigPctInput');

  const playerScoreEl = document.getElementById('playerScore');
  const bankerScoreEl = document.getElementById('bankerScore');
  const winnerTextEl = document.getElementById('winnerText');
  const detailTextEl = document.getElementById('detailText');
  const linePredictEl = document.getElementById('linePredict');
  const linePredictMetaEl = document.getElementById('linePredictMeta');
  const lineStatsEl = document.getElementById('lineStats');
  const heatBoxEl = document.getElementById('heatBox');
  const powerBoxEl = document.getElementById('powerBox');
  const historyListEl = document.getElementById('historyList');

  const bankrollBaseTextEl = document.getElementById('bankrollBaseText');
  const bankrollNowTextEl = document.getElementById('bankrollNowText');
  const profitTextEl = document.getElementById('profitText');
  const betSuggestTextEl = document.getElementById('betSuggestText');

  function fmtMoney(n) {
    return Math.round(Number(n) || 0).toLocaleString('zh-Hant-TW');
  }

  function getPctValue(el, fallback) {
    const v = parseFloat(el.value);
    return Number.isFinite(v) && v >= 0 ? v : fallback;
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveToStorage, 120);
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        values,
        currentStep,
        selectedIndex,
        historyData,
        pendingPrediction,
        roundInput: roundInputEl.value || '',
        bankrollBase,
        bankrollNow,
        lastBetAmount,
        lastPowerLabel,
        bankrollInput: bankrollInputEl.value || '',
        smallPct: smallPctInputEl.value || '1',
        midPct: midPctInputEl.value || '2',
        bigPct: bigPctInputEl.value || '3'
      }));
    } catch (e) {}
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (Array.isArray(data.values) && data.values.length === 6) values = data.values;
      currentStep = Number.isInteger(data.currentStep) ? data.currentStep : 0;
      selectedIndex = Number.isInteger(data.selectedIndex) ? data.selectedIndex : null;
      historyData = Array.isArray(data.historyData) ? data.historyData.slice(0, MAX_HISTORY) : [];
      pendingPrediction = data.pendingPrediction || null;
      roundInputEl.value = data.roundInput || '';

      bankrollBase = Number(data.bankrollBase) || 0;
      bankrollNow = Number(data.bankrollNow) || 0;
      lastBetAmount = Number(data.lastBetAmount) || 0;
      lastPowerLabel = data.lastPowerLabel || '觀望';

      bankrollInputEl.value = data.bankrollInput || (bankrollBase ? String(bankrollBase) : '');
      smallPctInputEl.value = data.smallPct || '1';
      midPctInputEl.value = data.midPct || '2';
      bigPctInputEl.value = data.bigPct || '3';
    } catch (e) {}
  }

  function getValue(card) {
    if (!card) return 0;
    if (card === 'A') return 1;
    if (card === '10' || card === 'J' || card === 'Q' || card === 'K') return 0;
    return parseInt(card, 10) || 0;
  }

  function getTrueCountWeight(card) {
    if (!card) return 0;
    if (['A', '2', '7', '8', '9'].includes(card)) return 1;
    if (['3', '4', '5', '6'].includes(card)) return -1;
    return 0;
  }

  function getCards(arr) {
    return arr.filter(Boolean);
  }

  function getRoundNumber() {
    const n = parseInt(roundInputEl.value, 10);
    return Number.isFinite(n) && n > 0 ? n : null;
  }

  function getDecksByRound(roundNo) {
    if (roundNo === null) return null;
    if (roundNo <= 10) return 8;
    if (roundNo <= 20) return 7;
    if (roundNo <= 30) return 6;
    if (roundNo <= 40) return 5;
    if (roundNo <= 50) return 4;
    return 3;
  }

  function getActualResultLabel(playerTotal, bankerTotal) {
    if (playerTotal > bankerTotal) return '閒';
    if (bankerTotal > playerTotal) return '莊';
    return '和';
  }

  function getWinnerClass(actual) {
    if (actual === '閒') return 'winner player';
    if (actual === '莊') return 'winner banker';
    return 'winner tie';
  }

  function getHistoryStatus(prediction, actual) {
    if (actual === '和') return '-';
    if (prediction !== '閒' && prediction !== '莊') return '-';
    return prediction === actual ? '準' : '失敗';
  }

  function isNatural(p2, b2) {
    return p2 >= 8 || b2 >= 8;
  }

  function shouldPlayerDraw(p2) {
    return p2 <= 5;
  }

  function shouldBankerDraw(b2, playerThird, playerDrew) {
    if (!playerDrew) return b2 <= 5;
    const pt = getValue(playerThird);
    if (b2 <= 2) return true;
    if (b2 === 3) return pt !== 8;
    if (b2 === 4) return pt >= 2 && pt <= 7;
    if (b2 === 5) return pt >= 4 && pt <= 7;
    if (b2 === 6) return pt === 6 || pt === 7;
    return false;
  }

  function getPickValueHtml(p) {
    if (p === '閒') return '<span style="color:#60a5fa;font-weight:900;">閒</span>';
    if (p === '莊') return '<span style="color:#f87171;font-weight:900;">莊</span>';
    return '<span style="color:#9ca3af;font-weight:900;">' + p + '</span>';
  }

  function colorPick(name, p) {
    const map = { M:'m-label', T:'t-label', R:'r-label' };
    return '<span class="' + map[name] + '">' + name + ':</span>' + getPickValueHtml(p);
  }

  function evaluateM(playerCards, bankerCards, allCards) {
    if (playerCards.length < 2 || bankerCards.length < 2) {
      return { pick:'待輸入', meta:'點差：-\\n公牌奇偶：-' };
    }
    const playerTotalRaw = playerCards.reduce((s, c) => s + getValue(c), 0);
    const bankerTotalRaw = bankerCards.reduce((s, c) => s + getValue(c), 0);
    const diff = playerTotalRaw - bankerTotalRaw;
    const sign1 = diff >= 0 ? '正' : '負';
    const publicCount = allCards.filter(c => ['10','J','Q','K'].includes(c)).length;
    const sign2 = publicCount % 2 === 0 ? '正' : '負';
    const finalSign = sign1 === sign2 ? '正' : '負';
    return {
      pick: finalSign === '正' ? '閒' : '莊',
      meta: '點差：' + diff + '\\n公牌奇偶：' + (publicCount % 2 === 0 ? '正' : '負')
    };
  }

  function evaluateT(allCards, roundNo) {
    if (allCards.length === 0) {
      return { pick:'待輸入', meta:'真數：-\\n建議：-' };
    }
    const decks = getDecksByRound(roundNo);
    if (!decks) {
      return { pick:'待輸入', meta:'真數：-\\n建議：請輸入局數' };
    }
    const total = allCards.reduce((sum, card) => sum + getTrueCountWeight(card), 0);
    const trueCount = total / decks;
    let pick = '觀望';
    if (trueCount > 0) pick = '閒';
    else if (trueCount < 0) pick = '莊';

    const absTC = Math.abs(trueCount);
    let advice = '觀望';
    if (absTC > 0.6) advice = '下大注';
    else if (absTC > 0.5) advice = '小下注';
    else if (absTC >= 0.35) advice = '看一把';
    else advice = '觀望';
    if (pick === '觀望') advice = '觀望';

    return {
      pick,
      meta: '真數：' + trueCount.toFixed(2) + '\\n建議：' + advice
    };
  }

  function evaluateR(playerCards, bankerCards, allCards) {
    if (playerCards.length < 2 || bankerCards.length < 2) {
      return { pick:'待輸入', meta:'尾數：-\\n翻邊：-', flip:false };
    }
    const playerRaw = playerCards.reduce((s, c) => s + getValue(c), 0);
    const bankerRaw = bankerCards.reduce((s, c) => s + getValue(c), 0);
    const tail = (playerRaw % 10) + (bankerRaw % 10);
    const publicCount = allCards.filter(c => ['10','J','Q','K'].includes(c)).length;
    const flip = allCards.length === 5 || allCards.length === 6 || (allCards.length === 4 && publicCount === 0);

    let pick = tail === 19 ? '閒' : '莊';
    if (flip) pick = pick === '閒' ? '莊' : '閒';

    return {
      pick,
      meta: '尾數：' + tail + '\\n翻邊：' + (flip ? '是' : '否'),
      flip
    };
  }

  function getRoundState() {
    const playerCards = getCards([values[0], values[1], values[4]]);
    const bankerCards = getCards([values[2], values[3], values[5]]);
    const allCards = playerCards.concat(bankerCards);
    const roundNo = getRoundNumber();

    const p2 = (getValue(values[0]) + getValue(values[1])) % 10;
    const b2 = (getValue(values[2]) + getValue(values[3])) % 10;
    const playerThird = values[4] || null;
    const bankerThird = values[5] || null;

    let info = roundNo ? '請依序輸入牌面' : '請先輸入局數';
    if (roundNo && values[0] && values[1] && values[2] && values[3]) {
      if (isNatural(p2, b2)) {
        info = '天牌（不補）';
      } else {
        info = '';
        if (playerThird === null) info += shouldPlayerDraw(p2) ? '閒應補牌 ' : '閒不補 ';
        if (bankerThird === null) {
          if (playerThird === null && shouldPlayerDraw(p2)) info += '莊待閒第三張後判定';
          else info += shouldBankerDraw(b2, playerThird, playerThird !== null) ? '莊應補牌' : '莊不補';
        }
        if (!info.trim()) info = '本局已輸入完成';
      }
    }

    const hasEnough = playerCards.length >= 2 && bankerCards.length >= 2;
    const playerTotal = hasEnough ? playerCards.reduce((s, c) => s + getValue(c), 0) % 10 : null;
    const bankerTotal = hasEnough ? bankerCards.reduce((s, c) => s + getValue(c), 0) % 10 : null;
    const actual = hasEnough ? getActualResultLabel(playerTotal, bankerTotal) : '-';

    return {
      playerCards,
      bankerCards,
      allCards,
      playerTotal,
      bankerTotal,
      actual,
      info,
      roundNo,
      m: evaluateM(playerCards, bankerCards, allCards),
      t: evaluateT(allCards, roundNo),
      r: evaluateR(playerCards, bankerCards, allCards)
    };
  }

  function formatPredictMeta(mMeta, tMeta, rMeta) {
    const mParts = String(mMeta).split('\\n');
    const tParts = String(tMeta).split('\\n');
    const rParts = String(rMeta).split('\\n');

    return 'M點差:' + (mParts[0] || '點差：-').replace('點差：','') +
      '/公牌:' + (mParts[1] || '公牌奇偶：-').replace('公牌奇偶：','') +
      '｜T真數:' + (tParts[0] || '真數：-').replace('真數：','') +
      '/建議:' + (tParts[1] || '建議：-').replace('建議：','') +
      '｜R尾數:' + (rParts[0] || '尾數：-').replace('尾數：','') +
      '/翻邊:' + (rParts[1] || '翻邊：-').replace('翻邊：','');
  }

  function calcRate(key) {
    const valid = historyData.filter(item => item.actual !== '和' && item[key + 'Status'] !== '-');
    const hit = valid.filter(item => item[key + 'Status'] === '準').length;
    const total = valid.length;
    return { rate: total === 0 ? 0 : Math.round((hit / total) * 100), hit, total };
  }

  function computePower(state, stats) {
    const picks = [state.m.pick, state.t.pick, state.r.pick].filter(p => p === '閒' || p === '莊');
    const playerCount = picks.filter(p => p === '閒').length;
    const bankerCount = picks.filter(p => p === '莊').length;
    const consensus = Math.max(playerCount, bankerCount);
    const maxRate = Math.max(stats.m.rate, stats.t.rate, stats.r.rate);

    if (consensus < 2) return { text:'下注：觀望', cls:'power-box power-wait', size:'觀望' };
    if (consensus === 3 && maxRate >= 60) return { text:'下注：大注', cls:'power-box power-strong', size:'大注' };
    if (consensus === 3 || maxRate >= 55) return { text:'下注：中注', cls:'power-box power-mid', size:'中注' };
    return { text:'下注：小注', cls:'power-box power-low', size:'小注' };
  }

  function recalcBankroll() {
    const inputVal = Number(bankrollInputEl.value) || 0;
    if (inputVal > 0 && bankrollBase === 0) {
      bankrollBase = inputVal;
      bankrollNow = inputVal;
    } else if (inputVal > 0 && bankrollBase !== inputVal && historyData.length === 0 && !pendingPrediction) {
      bankrollBase = inputVal;
      bankrollNow = inputVal;
    }

    const profit = bankrollNow - bankrollBase;
    bankrollBaseTextEl.textContent = fmtMoney(bankrollBase);
    bankrollNowTextEl.textContent = fmtMoney(bankrollNow);
    profitTextEl.textContent = (profit > 0 ? '+' : '') + fmtMoney(profit);
    profitTextEl.className = 'bk-value bk-profit ' + (profit > 0 ? 'pos' : profit < 0 ? 'neg' : '');
    betSuggestTextEl.textContent = fmtMoney(recommendedBet);
  }

  function applyBetRecommendation(powerSize) {
    const smallPct = getPctValue(smallPctInputEl, 1);
    const midPct = getPctValue(midPctInputEl, 2);
    const bigPct = getPctValue(bigPctInputEl, 3);

    let pct = 0;
    if (powerSize === '小注') pct = smallPct;
    else if (powerSize === '中注') pct = midPct;
    else if (powerSize === '大注') pct = bigPct;

    const baseMoney = bankrollNow > 0 ? bankrollNow : (Number(bankrollInputEl.value) || 0);
    recommendedBet = pct > 0 ? Math.max(1, Math.round(baseMoney * pct / 100)) : 0;
    lastPowerLabel = powerSize;
    recalcBankroll();
  }

  function settleRound(resultType) {
    if (recommendedBet <= 0) return;
    if (bankrollNow <= 0) bankrollNow = Number(bankrollInputEl.value) || 0;

    if (resultType === 'win') {
      bankrollNow += recommendedBet;
    } else if (resultType === 'lose') {
      bankrollNow -= recommendedBet;
      if (bankrollNow < 0) bankrollNow = 0;
    }
    lastBetAmount = recommendedBet;
    recalcBankroll();
    scheduleSave();
  }

  function renderPredict(state) {
    linePredictEl.innerHTML =
      colorPick('M', state.m.pick) + '　' +
      colorPick('T', state.t.pick) + '　' +
      colorPick('R', state.r.pick);

    linePredictMetaEl.textContent = formatPredictMeta(state.m.meta, state.t.meta, state.r.meta);
  }

  function renderStatsAndHeat(state) {
    const m = calcRate('m');
    const t = calcRate('t');
    const r = calcRate('r');

    const stats = [
      { cls:'m', name:'M勝率', rate:m.rate },
      { cls:'t', name:'T勝率', rate:t.rate },
      { cls:'r', name:'R勝率', rate:r.rate }
    ];
    const maxRate = Math.max(...stats.map(s => s.rate));

    lineStatsEl.innerHTML = stats.map(item => {
      const best = item.rate === maxRate && maxRate > 0 ? ' best' : '';
      return '<div class="stat ' + item.cls + best + '">' +
        '<div class="stat-name">' + item.name + '</div>' +
        '<div class="stat-rate">' + item.rate + '%</div>' +
      '</div>';
    }).join('');

    heatBoxEl.textContent = maxRate > 0
      ? '熱區判斷：' + stats.filter(s => s.rate === maxRate).map(s => s.name.replace('勝率','')).join(' / ') + ' 發威中（' + maxRate + '%）'
      : '熱區判斷：目前尚無資料';

    const power = computePower(state, {m,t,r});
    powerBoxEl.textContent = power.text;
    powerBoxEl.className = power.cls;
    applyBetRecommendation(power.size);
  }

  function renderScore(state) {
    playerScoreEl.textContent = '閒 ' + (state.playerTotal === null ? 0 : state.playerTotal);
    bankerScoreEl.textContent = '莊 ' + (state.bankerTotal === null ? 0 : state.bankerTotal);
    winnerTextEl.textContent = state.actual === '閒' ? '閒贏' : state.actual === '莊' ? '莊贏' : '和局';
    winnerTextEl.className = getWinnerClass(state.actual);
    detailTextEl.textContent = state.info;
  }

  function renderHistory() {
    const currentState = getRoundState();
    const liveItems = [];

    if (pendingPrediction) {
      const hasAnyCurrentCard = currentState.playerCards.length > 0 || currentState.bankerCards.length > 0;
      const liveActual = currentState.playerCards.length >= 2 && currentState.bankerCards.length >= 2 ? currentState.actual : '-';

      if (hasAnyCurrentCard) {
        liveItems.push({
          sourceRound: pendingPrediction.sourceRound,
          targetRound: pendingPrediction.targetRound,
          player: currentState.playerCards.join(' '),
          banker: currentState.bankerCards.join(' '),
          actual: liveActual,
          mPick: pendingPrediction.mPick,
          tPick: pendingPrediction.tPick,
          rPick: pendingPrediction.rPick,
          mStatus: liveActual === '-' ? '-' : getHistoryStatus(pendingPrediction.mPick, liveActual),
          tStatus: liveActual === '-' ? '-' : getHistoryStatus(pendingPrediction.tPick, liveActual),
          rStatus: liveActual === '-' ? '-' : getHistoryStatus(pendingPrediction.rPick, liveActual),
          isLive: true
        });
      }
    }

    const items = liveItems.concat(historyData).slice(0, MAX_HISTORY);

    if (items.length === 0) {
      historyListEl.innerHTML = '<div class="history-empty">目前還沒有歷史紀錄</div>';
      return;
    }

    historyListEl.innerHTML = items.map(item => {
      const mCls = item.mStatus === '準' ? 'status-hit' : item.mStatus === '失敗' ? 'status-miss' : 'status-draw';
      const tCls = item.tStatus === '準' ? 'status-hit' : item.tStatus === '失敗' ? 'status-miss' : 'status-draw';
      const rCls = item.rStatus === '準' ? 'status-hit' : item.rStatus === '失敗' ? 'status-miss' : 'status-draw';
      const actualClass = item.actual === '和' ? 'draw' : item.actual === '閒' ? 'hit' : item.actual === '莊' ? 'miss' : '';
      const roundText = '第' + item.sourceRound + '局預測第' + item.targetRound + '局' + (item.isLive ? '（進行中）' : '');
      const actualText = item.actual === '-' ? '待開' : item.actual;

      return '<div class="h-item">' +
        '<div class="h-top">' + roundText + '</div>' +
        '<div class="h-grid">' +
          '<div class="h-cards">' +
            '<div><strong>閒：</strong>' + (item.player || '-') + '</div>' +
            '<div><strong>莊：</strong>' + (item.banker || '-') + '</div>' +
          '</div>' +
          '<div class="h-mtr">' +
            '<div><strong>M</strong><br>' + item.mPick + '（<span class="' + mCls + '">' + item.mStatus + '</span>）</div>' +
            '<div><strong>T</strong><br>' + item.tPick + '（<span class="' + tCls + '">' + item.tStatus + '</span>）</div>' +
            '<div><strong>R</strong><br>' + item.rPick + '（<span class="' + rCls + '">' + item.rStatus + '</span>）</div>' +
          '</div>' +
          '<div class="h-result ' + actualClass + '">實際：' + actualText + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function highlight() {
    cells.forEach(c => c.classList.remove('active'));
    if (selectedIndex !== null) {
      const target = document.querySelector("[data-index='" + selectedIndex + "']");
      if (target) target.classList.add('active');
    }
  }

  function renderBoard() {
    cells.forEach(cell => {
      const idx = parseInt(cell.dataset.index, 10);
      const val = values[idx];
      cell.textContent = val;
      if (val) cell.classList.remove('empty');
      else cell.classList.add('empty');
    });
    highlight();
  }

  function renderAll() {
    const state = getRoundState();
    renderBoard();
    renderScore(state);
    renderPredict(state);
    renderStatsAndHeat(state);
    renderHistory();
    recalcBankroll();
    scheduleSave();
  }

  function inputCard(card) {
    if (selectedIndex !== null) {
      values[selectedIndex] = card;
      selectedIndex = null;
    } else if (currentStep < 6) {
      values[order[currentStep]] = card;
      currentStep += 1;
    }
    renderAll();
  }

  function skip() {
    if (selectedIndex !== null) {
      values[selectedIndex] = '';
      selectedIndex = null;
      renderAll();
      return;
    }
    if (currentStep < 6) {
      currentStep += 1;
      renderAll();
    }
  }

  function keepPendingOnScreen() {
    if (!pendingPrediction) return;
    linePredictEl.innerHTML =
      colorPick('M', pendingPrediction.mPick) + '　' +
      colorPick('T', pendingPrediction.tPick) + '　' +
      colorPick('R', pendingPrediction.rPick);
    linePredictMetaEl.textContent = formatPredictMeta(
      pendingPrediction.mMeta,
      pendingPrediction.tMeta,
      pendingPrediction.rMeta
    );
  }

  function saveRoundAndNext() {
    const state = getRoundState();
    const roundNo = getRoundNumber();

    if (!roundNo) {
      alert('請先輸入局數。');
      roundInputEl.focus();
      return;
    }
    if (state.playerCards.length < 2 || state.bankerCards.length < 2) {
      alert('請至少先輸入閒家與莊家的前兩張牌。');
      return;
    }

    if (pendingPrediction) {
      historyData.unshift({
        sourceRound: pendingPrediction.sourceRound,
        targetRound: pendingPrediction.targetRound,
        player: state.playerCards.join(' '),
        banker: state.bankerCards.join(' '),
        actual: state.actual,
        mPick: pendingPrediction.mPick,
        tPick: pendingPrediction.tPick,
        rPick: pendingPrediction.rPick,
        mStatus: getHistoryStatus(pendingPrediction.mPick, state.actual),
        tStatus: getHistoryStatus(pendingPrediction.tPick, state.actual),
        rStatus: getHistoryStatus(pendingPrediction.rPick, state.actual)
      });
      historyData = historyData.slice(0, MAX_HISTORY);
    }

    pendingPrediction = {
      sourceRound: roundNo,
      targetRound: roundNo + 1,
      mPick: String(state.m.pick),
      tPick: String(state.t.pick),
      rPick: String(state.r.pick),
      mMeta: state.m.meta,
      tMeta: state.t.meta,
      rMeta: state.r.meta
    };

    roundInputEl.value = String(roundNo + 1);
    values = ['', '', '', '', '', ''];
    currentStep = 0;
    selectedIndex = null;

    renderAll();
    keepPendingOnScreen();
  }

  function clearBoard() {
    values = ['', '', '', '', '', ''];
    currentStep = 0;
    selectedIndex = null;
    renderAll();
    keepPendingOnScreen();
  }

  function clearHistory() {
    historyData = [];
    pendingPrediction = null;
    renderAll();
  }

  function syncBankrollFromInput() {
    const v = Number(bankrollInputEl.value) || 0;
    bankrollBase = v;
    bankrollNow = v;
    recalcBankroll();
    scheduleSave();
  }

  cells.forEach(cell => {
    cell.addEventListener('click', function () {
      selectedIndex = parseInt(cell.dataset.index, 10);
      highlight();
      scheduleSave();
    }, { passive:true });
  });

  roundInputEl.addEventListener('input', function () {
    renderAll();
    keepPendingOnScreen();
  });

  bankrollInputEl.addEventListener('change', syncBankrollFromInput);
  smallPctInputEl.addEventListener('change', renderAll);
  midPctInputEl.addEventListener('change', renderAll);
  bigPctInputEl.addEventListener('change', renderAll);

  cardButtonsEl.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-card]');
    if (!btn) return;
    inputCard(btn.dataset.card);
  });

  skipBtn.addEventListener('click', skip);
  nextBtn.addEventListener('click', saveRoundAndNext);
  clearBoardBtn.addEventListener('click', clearBoard);
  clearHistoryBtn.addEventListener('click', clearHistory);

  winBtn.addEventListener('click', function(){ settleRound('win'); });
  loseBtn.addEventListener('click', function(){ settleRound('lose'); });
  tieBtn.addEventListener('click', function(){ settleRound('tie'); });

  loadFromStorage();
  if (bankrollBase > 0 && !bankrollInputEl.value) bankrollInputEl.value = String(bankrollBase);
  renderAll();
  keepPendingOnScreen();
})();
</script>
</body>
</html>
